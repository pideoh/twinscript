version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # "chore(deps): ..." passes the Conventional Commits check and does not by itself make a release.
    commit-message:
      prefix: chore
      include: scope
    # Only versions that have been out for a week: time for a bad release to be noticed and pulled.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # "chore(deps): ..." / "chore(deps-dev): ...": the update ships with the next release.
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7
    groups:
      # Checking and testing tools: not part of the app that is shipped. Merged automatically
      # (see dependabot-automerge.yml). Everything else, i.e. Electron and electron-builder,
      # gets its own pull request and is merged by a person after trying the app.
      tools:
        patterns: ["@biomejs/biome", "playwright-core", "axe-core"]
      # The one library that runs in the shipped app. Its own pull request, never merged automatically:
      # a person reads what changed, checks that the bundle still imports nothing and needs no change to the
      # content security policy, and updates THIRD-PARTY-NOTICES.md.
      runtime:
        patterns: ["mediabunny"]
