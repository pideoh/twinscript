# Once a month, compares the Gemini prices in src/usage/pricing.js (used for cost estimates) with Google's pricing
# page. When they differ, it opens a pull request with the new prices, or updates the one already open, for a
# maintainer to check against the page and merge; it is never merged automatically. When the page cannot be
# read or parsed, or a change looks wrong (more than 5x, a model gone), the run fails and nothing is proposed:
# run `node scripts/update-pricing.mjs` by hand (see CONTRIBUTING.md).
name: pricing-check
on:
  schedule:
    - cron: '23 4 3 * *' # 04:23 UTC on the 3rd of each month
  workflow_dispatch:

permissions: {}

concurrency:
  group: pricing-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BRANCH: automation/update-gemini-prices
      TITLE: 'fix: update the Gemini prices used for cost estimates'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Exits non-zero (and fails the run) when the page cannot be parsed or a change is refused. Otherwise it
      # rewrites src/usage/pricing.js only when the prices changed, and writes the differences to the report.
      - name: Compare with the pricing page
        run: node scripts/update-pricing.mjs --write --report "$RUNNER_TEMP/pricing-report.md"
      # The pull request is opened with RELEASE_PR_TOKEN, as in release.yml: one opened with the workflow's own
      # token would not start the checks that main requires. gh reads the token from GH_TOKEN, and
      # `gh auth setup-git` lets git push with it, so it never appears on a command line.
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- src/usage/pricing.js; then
            echo "The prices match the pricing page; nothing to propose."
            exit 0
          fi
          {
            echo "## Summary"
            echo
            cat "$RUNNER_TEMP/pricing-report.md"
            echo
            echo "Opened by the monthly pricing-check workflow. Check the numbers against the page before merging."
            echo
            echo "## Testing"
            echo
            echo "\`node scripts/update-pricing.mjs\` parsed the page; the checks on this pull request run the tests."
            echo
            echo "## Screens and docs"
            echo
            echo "Not needed"
          } > "$RUNNER_TEMP/pr-body.md"
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -q -m "$TITLE" -- src/usage/pricing.js
          git push --force origin "HEAD:refs/heads/$BRANCH"
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[].number')
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE" --head "$BRANCH" --title "$TITLE" \
              --body-file "$RUNNER_TEMP/pr-body.md"
          fi
