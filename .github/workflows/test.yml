name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the commit check reads the commits the pull request adds
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # release-please reads the commit subjects on main to choose the version and write the
      # changelog, so the commits a pull request adds and its title (the subject when it is
      # squash-merged) must follow Conventional Commits.
      - name: Check commit subjects and the pull request title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-commits.js --title "$TITLE" "$BASE..$HEAD"
      - run: npm ci
      - run: npm run lint
      # Unit tests with a coverage summary in the log.
      - run: node --test --experimental-test-coverage "test/unit/**/*.test.js"
      # The test files run in parallel. Node's default is one fewer than the CPU count, which is a
      # single file at a time on a two-core runner; the tests mostly wait, so four at once is fine.
      # Chrome's coverage of each page is written to dist/e2e-coverage (see scripts/e2e-coverage.mjs).
      - run: node --test --test-concurrency=4 "test/e2e/*.e2e.js"
        env:
          E2E_COVERAGE: dist/e2e-coverage
      # Which lines of src/ the browser tests ran, in the log.
      - run: node scripts/e2e-coverage.mjs dist/e2e-coverage

  # The unit tests cover path handling and process rules for the desktop app, which differ by OS.
  unit-other-os:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test

  # The browser tests against the desktop app (Electron), on the systems it ships for. No secrets and
  # no API key: the Gemini endpoints are mocked as in the browser run. Nothing asks the runner for a
  # permission: the microphone is Chromium's fake device, PC audio is a stand-in in the page, and the
  # API key store is kept in memory instead of the keychain (test/e2e/helpers/desktop.js).
  e2e-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e:desktop
