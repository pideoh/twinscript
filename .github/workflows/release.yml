# Builds the desktop app and publishes it as a GitHub Release whenever the app changes on main.
# The version is chosen from the commits since the last release (see scripts/next-version.js).
name: release
on:
  push:
    branches: [main]
    paths: ['app/**', 'src/**', 'icons/**', 'index.html', 'styles.css', 'manifest.webmanifest', 'package.json']
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [auto, patch, minor, major]
        default: auto

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version is computed from the full history and its tags
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - id: next
        run: echo "version=$(node scripts/next-version.js "${{ inputs.bump || 'auto' }}")" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # --publish never: electron-builder only builds; the release job below does the publishing.
      - run: npm run ${{ matrix.script }} -- --publish never -c.extraMetadata.version=${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: zips-${{ runner.os }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/*.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v$VERSION" --generate-notes
