# Releases are made from a release pull request that release-please keeps up to date on main.
# Each push to main lets release-please open or update the pull request "chore(main): release X.Y.Z",
# which bumps package.json and updates CHANGELOG.md from the Conventional Commits since the last release.
# Merging that pull request makes release-please tag vX.Y.Z and create the GitHub release; the jobs
# below then build the desktop app from the tag and upload the zips to that release.
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:

# Jobs get read-only access unless they ask for more.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Everything goes through RELEASE_PR_TOKEN: a pull request opened with the workflow's own token
    # would not start the checks that main requires.
    permissions: {}
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      # Third-party action: pinned to a commit so a moved tag cannot change what runs here.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ secrets.RELEASE_PR_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false # let the other builds finish so their logs are available too
      matrix:
        include:
          # One job per zip, so the two macOS architectures are built at the same time.
          - name: mac-arm64
            os: macos-latest
            args: --mac zip --arm64
          - name: mac-x64
            os: macos-latest
            args: --mac zip --x64
          - name: win-x64
            os: windows-latest
            args: --win zip --x64
          # Built on the x64 runner; electron-builder downloads the arm64 Electron.
          - name: win-arm64
            os: windows-latest
            args: --win zip --arm64
    runs-on: ${{ matrix.os }}
    env:
      # 7-Zip level for the zips (default is 5). Level 1 is about three times faster and the
      # files come out about 5% larger.
      ELECTRON_BUILDER_COMPRESSION_LEVEL: 1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The macOS app is signed with a fixed self-signed certificate so that its identity, and with it
      # the permissions users granted, stays the same from release to release (scripts/sign-mac.js).
      - name: Set up the macOS signing certificate
        if: runner.os == 'macOS'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: sh scripts/ci-mac-signing-keychain.sh setup
      # --publish never: electron-builder only builds; the release job below uploads the files.
      # The version in the file names comes from package.json, which the release pull request set.
      - run: npx electron-builder ${{ matrix.args }} --publish never
        shell: bash
      # Fails unless the app in the zip has a valid signature whose identity is the certificate, not
      # a per-build hash.
      - name: Check the macOS signature
        if: runner.os == 'macOS'
        run: |
          mkdir "$RUNNER_TEMP/unzipped"
          ditto -x -k dist/*.zip "$RUNNER_TEMP/unzipped"
          node scripts/verify-mac-signature.js "$RUNNER_TEMP/unzipped/Twinscript.app" io.github.pideoh.twinscript
      - name: Remove the signing keychain
        if: always() && runner.os == 'macOS'
        run: sh scripts/ci-mac-signing-keychain.sh cleanup
      - uses: actions/upload-artifact@v7
        with:
          name: zips-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0 # already compressed
          retention-days: 1 # only handed to the release job below; the release keeps the zips

  release:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # to upload files to the release
      id-token: write       # for the build provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # The zips are named after the version in package.json; it must be the one that was tagged.
      - name: Check the version in the file names
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: ls dist/twinscript-"$VERSION"-*.zip
      - name: Checksums
        run: cd dist && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      # Lets anyone verify that a zip was built by this workflow from this repository
      # (`gh attestation verify <zip> --repo OWNER/REPO`). Not available to private repositories.
      - uses: actions/attest-build-provenance@v4
        if: github.event.repository.private == false
        with:
          subject-path: dist/*.zip
      # release-please created the release and its notes; this adds the downloads.
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/*.zip dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY"
