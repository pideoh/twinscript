# Builds the desktop app and publishes it as a GitHub Release whenever the app changes on main.
# The version is chosen from the commits since the last release (see scripts/next-version.js).
name: release
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'icons/**'
      - index.html
      - styles.css
      - package.json
      # so that a fix to the release process itself is released
      - .github/workflows/release.yml
      - scripts/next-version.js
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [auto, patch, minor, major]
        default: auto

# Jobs get read-only access unless they ask for more (only the release job does).
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      release: ${{ steps.needed.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version is computed from the full history and its tags
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      # Tool, workflow, test and doc changes do not change what users download: no new version.
      # A manual run always releases.
      - id: needed
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$MANUAL" = "true" ]; then echo "release=true" >> "$GITHUB_OUTPUT"
          else echo "release=$(node scripts/release-needed.js)" >> "$GITHUB_OUTPUT"; fi
      - id: next
        run: echo "version=$(node scripts/next-version.js "${{ inputs.bump || 'auto' }}")" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false # let the other builds finish so their logs are available too
      matrix:
        include:
          # One job per zip, so the two macOS architectures are built at the same time.
          - name: mac-arm64
            os: macos-latest
            args: --mac zip --arm64
          - name: mac-x64
            os: macos-latest
            args: --mac zip --x64
          - name: win-x64
            os: windows-latest
            args: --win zip --x64
    runs-on: ${{ matrix.os }}
    env:
      # 7-Zip level for the zips (default is 5). Level 1 is about three times faster and the
      # files come out about 5% larger.
      ELECTRON_BUILDER_COMPRESSION_LEVEL: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The macOS app is signed with a fixed self-signed certificate so that its identity, and with it
      # the permissions users granted, stays the same from release to release (scripts/sign-mac.js).
      - name: Set up the macOS signing certificate
        if: runner.os == 'macOS'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: sh scripts/ci-mac-signing-keychain.sh setup
      # --publish never: electron-builder only builds; the release job below does the publishing.
      # bash on every runner: PowerShell splits a "--config.key=value" argument at the dot.
      - run: npx electron-builder ${{ matrix.args }} --publish never --config.extraMetadata.version=${{ needs.version.outputs.version }}
        shell: bash
      # Fails unless the app in the zip has a valid signature whose identity is the certificate, not
      # a per-build hash.
      - name: Check the macOS signature
        if: runner.os == 'macOS'
        run: |
          mkdir "$RUNNER_TEMP/unzipped"
          ditto -x -k dist/*.zip "$RUNNER_TEMP/unzipped"
          node scripts/verify-mac-signature.js "$RUNNER_TEMP/unzipped/Twinscript.app" io.github.pideoh.twinscript
      - name: Remove the signing keychain
        if: always() && runner.os == 'macOS'
        run: sh scripts/ci-mac-signing-keychain.sh cleanup
      - uses: actions/upload-artifact@v7
        with:
          name: zips-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0 # already compressed

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write       # for the build provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      # Lets anyone verify that a zip was built by this workflow from this repository
      # (`gh attestation verify <zip> --repo OWNER/REPO`). Not available to private repositories.
      - uses: actions/attest-build-provenance@v4
        if: github.event.repository.private == false
        with:
          subject-path: dist/*.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/*.zip dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v$VERSION" --generate-notes
