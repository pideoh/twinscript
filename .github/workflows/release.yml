# Builds the desktop app and publishes it as a GitHub Release whenever the app changes on main.
# The version is chosen from the commits since the last release (see scripts/next-version.js).
name: release
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'native/**'
      - 'icons/**'
      - index.html
      - styles.css
      - package.json
      # so that a fix to the release process itself is released
      - .github/workflows/release.yml
      - scripts/next-version.js
      - scripts/build-mac-helper.sh
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [auto, patch, minor, major]
        default: auto

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version is computed from the full history and its tags
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      - id: next
        run: echo "version=$(node scripts/next-version.js "${{ inputs.bump || 'auto' }}")" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false # let the other builds finish so their logs are available too
      matrix:
        include:
          # One job per zip, so the two macOS architectures are built at the same time.
          - name: mac-arm64
            os: macos-latest
            args: --mac zip --arm64
          - name: mac-x64
            os: macos-latest
            args: --mac zip --x64
          - name: win-x64
            os: windows-latest
            args: --win zip --x64
    runs-on: ${{ matrix.os }}
    env:
      # 7-Zip level for the zips (default is 5). Level 1 is about three times faster and the
      # files come out about 5% larger.
      ELECTRON_BUILDER_COMPRESSION_LEVEL: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The macOS PC audio helper only changes with its source, so it is built once and reused.
      - uses: actions/cache@v6
        id: helper
        if: runner.os == 'macOS'
        with:
          path: native/mac/build/system-audio
          key: mac-helper-${{ hashFiles('native/mac/system-audio.swift', 'scripts/build-mac-helper.sh') }}
      - run: sh scripts/build-mac-helper.sh
        if: runner.os == 'macOS' && steps.helper.outputs.cache-hit != 'true'
      # --publish never: electron-builder only builds; the release job below does the publishing.
      # bash on every runner: PowerShell splits a "--config.key=value" argument at the dot.
      - run: npx electron-builder ${{ matrix.args }} --publish never --config.extraMetadata.version=${{ needs.version.outputs.version }}
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: zips-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0 # already compressed

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write       # for the build provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      # Lets anyone verify that a zip was built by this workflow from this repository
      # (`gh attestation verify <zip> --repo OWNER/REPO`). Not available to private repositories.
      - uses: actions/attest-build-provenance@v4
        if: github.event.repository.private == false
        with:
          subject-path: dist/*.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/*.zip dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v$VERSION" --generate-notes
