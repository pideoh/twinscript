<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>リアルタイム翻訳</title>
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="リアルタイム翻訳">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside id="sidebar" aria-label="セッション">
    <button id="newSession" class="new-session">＋ 新しいセッション</button>
    <nav id="sessionList"></nav>
  </aside>
  <div id="backdrop"></div>

  <div class="app">
    <header class="bar">
      <div class="langs">
        <button id="menu" class="icon-btn" title="セッション一覧" aria-label="セッション一覧">☰</button>
        <select id="langA" aria-label="言語1"></select>
        <button id="swap" class="icon-btn" title="入れ替え" aria-label="言語を入れ替え">⇄</button>
        <select id="langB" aria-label="言語2"></select>
      </div>
      <div class="tools">
        <select id="source" aria-label="音声入力">
          <option value="mic">マイク</option>
          <option value="system">PC音声（タブ/画面共有）</option>
          <option value="both">マイク＋PC音声</option>
        </select>
        <button id="export" class="icon-btn" title="ダウンロード" aria-label="ダウンロード">⤓</button>
        <button id="openSettings" class="icon-btn" title="設定" aria-label="設定">⚙</button>
      </div>
    </header>

    <div class="log-wrap">
      <main id="log" aria-live="polite">
        <div id="empty" class="empty">
          <p>言語を2つ選んで「翻訳開始」を押してください。</p>
          <p class="sub">どちらの言語で話しても自動で判定し、もう一方の言語に翻訳します。</p>
        </div>
        <div id="anchor"></div>
      </main>
      <button id="jump" class="jump" hidden>最新へ ↓</button>
    </div>

    <section id="now" class="now" hidden aria-label="いま話している文">
      <div class="now-head"><span class="dot on"></span><span>いま</span></div>
      <div id="nowList" class="now-list"></div>
    </section>

    <div id="toast" class="toast" hidden></div>

    <footer class="dock">
      <div class="status">
        <span id="dot" class="dot"></span>
        <span id="statusText">停止中</span>
        <span id="clock" class="clock">00:00:00</span>
        <span class="meter"><span id="level"></span></span>
      </div>
      <button id="toggle" class="primary">翻訳開始</button>
    </footer>
  </div>

  <dialog id="exportDialog">
    <form method="dialog" class="settings">
      <h2>ダウンロード</h2>
      <label>文字起こしの形式
        <select id="exportFormat">
          <option value="txt">テキスト (.txt)</option>
          <option value="md">Markdown の表 (.md)</option>
          <option value="csv">CSV / Excel (.csv)</option>
          <option value="srt">字幕 (.srt)</option>
        </select>
      </label>
      <label>内容
        <select id="exportContent">
          <option value="both">原文と訳文</option>
          <option value="src">原文のみ</option>
          <option value="tgt">訳文のみ</option>
        </select>
      </label>
      <div class="actions"><button type="button" id="exportTranscript" class="primary">文字起こしを保存</button></div>
      <div id="recordings" class="recordings"></div>
      <div class="actions"><button value="close" class="plain">閉じる</button></div>
    </form>
  </dialog>

  <dialog id="settings">
    <form method="dialog" class="settings">
      <h2>設定</h2>
      <label>Gemini APIキー
        <input id="apiKey" type="password" autocomplete="off" placeholder="AIza...">
        <small><a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a> で無料で発行できます。キーはこの端末のブラウザ内にのみ保存されます。</small>
      </label>
      <label>翻訳モデル
        <input id="translateModel" type="text" spellcheck="false">
      </label>
      <label class="check"><input id="interimTranslate" type="checkbox"> 話している途中の文も翻訳する（リアルタイム重視）</label>
      <label class="check"><input id="smart" type="checkbox"> 文字起こしを整形する（フィラー除去。確定が少し遅くなることがあります）</label>
      <label class="check"><input id="record" type="checkbox"> 音声を録音して保存する（この端末のブラウザ内。1時間で約15MB）</label>
      <label>用語集・会議の背景（翻訳に反映されます）
        <textarea id="glossary" rows="3" placeholder="例: 固有名詞、製品名、会議のテーマなど"></textarea>
      </label>
      <label>文字サイズ
        <input id="fontSize" type="range" min="14" max="30" step="1">
      </label>
      <div class="actions"><button class="primary" value="ok">保存</button></div>
    </form>
  </dialog>

  <script type="module" src="src/app.js"></script>
</body>
</html>
