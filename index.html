<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Twinscript</title>
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Twinscript">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside id="sidebar" aria-label="Sessions" data-i18n-aria-label="sidebar.label">
    <button id="newSession" class="new-session" data-i18n="sidebar.newSession">＋ New session</button>
    <nav id="sessionList"></nav>
  </aside>
  <div id="backdrop"></div>

  <div class="app">
    <header class="bar">
      <div class="langs">
        <button id="menu" class="icon-btn" title="Sessions" aria-label="Sessions" data-i18n-title="header.menu" data-i18n-aria-label="header.menu">☰</button>
        <select id="langA" aria-label="Language 1" data-i18n-aria-label="header.langA"></select>
        <button id="swap" class="icon-btn" title="Swap" aria-label="Swap languages" data-i18n-title="header.swap.title" data-i18n-aria-label="header.swap.label">⇄</button>
        <select id="langB" aria-label="Language 2" data-i18n-aria-label="header.langB"></select>
      </div>
      <div class="tools">
        <select id="source" aria-label="Audio input" data-i18n-aria-label="header.source">
          <option value="mic" data-i18n="source.mic">Microphone</option>
          <option value="system" data-i18n="source.system">PC audio (tab/screen share)</option>
          <option value="both" data-i18n="source.both">Microphone + PC audio</option>
        </select>
        <button id="pip" class="icon-btn" title="Show captions in a separate window (always on top)" aria-label="Show captions in a separate window" data-i18n-title="header.pip.title" data-i18n-aria-label="header.pip.label" hidden>⧉</button>
        <button id="export" class="icon-btn" title="Download" aria-label="Download" data-i18n-title="header.export" data-i18n-aria-label="header.export">⤓</button>
        <button id="openSettings" class="icon-btn" title="Settings" aria-label="Settings" data-i18n-title="header.settings" data-i18n-aria-label="header.settings">⚙</button>
      </div>
    </header>

    <div class="log-wrap">
      <main id="log" aria-live="polite">
        <div id="empty" class="empty">
          <p data-i18n="empty.main">Choose two languages and press "Start translating".</p>
          <p class="sub" data-i18n="empty.sub">Speak in either language. It is detected automatically and translated into the other one.</p>
        </div>
        <div id="anchor"></div>
      </main>
      <button id="jump" class="jump" data-i18n="log.jump" hidden>Latest ↓</button>
    </div>

    <section id="now" class="now" hidden aria-label="Sentence being spoken" data-i18n-aria-label="now.label">
      <div class="now-head"><span class="dot on"></span><span data-i18n="now.head">Now</span></div>
      <div id="nowList" class="now-list"></div>
    </section>

    <div id="toast" class="toast" hidden></div>

    <footer class="dock">
      <div class="status">
        <span id="dot" class="dot"></span>
        <span id="statusText">Stopped</span>
        <span id="clock" class="clock">00:00:00</span>
        <span class="meter"><span id="level"></span></span>
      </div>
      <button id="toggle" class="primary">Start translating</button>
    </footer>
  </div>

  <dialog id="exportDialog">
    <form method="dialog" class="settings">
      <h2 data-i18n="export.title">Download</h2>
      <label><span data-i18n="export.format">Transcript format</span>
        <select id="exportFormat">
          <option value="txt" data-i18n="export.format.txt">Text (.txt)</option>
          <option value="md" data-i18n="export.format.md">Markdown table (.md)</option>
          <option value="csv" data-i18n="export.format.csv">CSV / Excel (.csv)</option>
          <option value="srt" data-i18n="export.format.srt">Subtitles (.srt)</option>
        </select>
      </label>
      <label><span data-i18n="export.content">Content</span>
        <select id="exportContent">
          <option value="both" data-i18n="export.content.both">Source and translation</option>
          <option value="src" data-i18n="export.content.src">Source only</option>
          <option value="tgt" data-i18n="export.content.tgt">Translation only</option>
        </select>
      </label>
      <div class="actions"><button type="button" id="exportTranscript" class="primary" data-i18n="export.saveTranscript">Save transcript</button></div>
      <div id="recordings" class="recordings"></div>
      <div class="actions"><button value="close" class="plain" data-i18n="export.close">Close</button></div>
    </form>
  </dialog>

  <dialog id="settings">
    <form method="dialog" class="settings">
      <h2 data-i18n="settings.title">Settings</h2>
      <label><span data-i18n="settings.apiKey">Gemini API key</span>
        <input id="apiKey" type="password" autocomplete="off" placeholder="AIza...">
        <small><span data-i18n="settings.apiKey.helpBefore">Get one for free at </span><a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a><span data-i18n="settings.apiKey.helpAfter">. The key is stored only in this browser on this device.</span></small>
        <small id="settingsRunning" data-i18n="settings.running" hidden>Translation is running. Changes to the API key, translation model, cleanup, recording, glossary and target language take effect the next time you start.</small>
      </label>
      <label><span data-i18n="settings.model">Translation model</span>
        <input id="translateModel" type="text" spellcheck="false">
      </label>
      <label class="check"><input id="interimTranslate" type="checkbox"> <span data-i18n="settings.interim">Translate sentences while they are being spoken (favors real-time)</span></label>
      <label class="check"><input id="smart" type="checkbox"> <span data-i18n="settings.smart">Clean up the transcript (removes fillers; sentences may take a little longer to finalize)</span></label>
      <label class="check"><input id="record" type="checkbox"> <span data-i18n="settings.record">Record and save the audio (in this browser on this device; about 15 MB per hour)</span></label>
      <label><span data-i18n="settings.otherInto">When a language other than these two is spoken, translate into</span>
        <select id="otherInto"><option value="A"></option><option value="B"></option></select>
      </label>
      <label><span data-i18n="settings.captionItems">Sentences kept in the area below</span> <output id="captionItemsOut"></output>
        <input id="captionItems" type="range" min="1" max="8" step="1">
        <small data-i18n="settings.captionItems.help">This includes the sentence being spoken. More is easier to re-read, and the area gets taller.</small>
      </label>
      <label><span data-i18n="settings.interimInterval">Interval for re-translating a sentence in progress</span> <output id="interimIntervalOut"></output>
        <input id="interimInterval" type="range" min="0.5" max="5" step="0.1">
        <small data-i18n="settings.interimInterval.help">Shorter shows translations sooner, but the text changes more often and uses more of the API.</small>
      </label>
      <label><span data-i18n="settings.glossary">Glossary and meeting background (used in translation)</span>
        <textarea id="glossary" rows="3" placeholder="e.g. proper nouns, product names, meeting topic" data-i18n-placeholder="settings.glossary.placeholder"></textarea>
      </label>
      <label><span data-i18n="settings.fontSize">Text size</span>
        <input id="fontSize" type="range" min="14" max="30" step="1">
      </label>
      <label><span data-i18n="settings.uiLang">Display language</span>
        <select id="uiLang"></select>
      </label>
      <div class="actions"><button class="primary" value="ok" data-i18n="settings.save">Save</button></div>
    </form>
  </dialog>

  <script type="module" src="src/app.js"></script>
</body>
</html>
